general {
    lock_cmd = pidof hyprlock || systemd-cat -t hyprlock hyprlock --immediate-render --no-fade-in
    # Blank before drawing the lock screen; still lock if blanking fails.
    before_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'; loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
    # Wait for the session-lock notification before suspending.
    inhibit_sleep = 3
}

# 5 dk: ekranı karart (KDE varsayılanı)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# 10 dk: kilitle
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 dk: ekranı kapat
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
