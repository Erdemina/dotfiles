# hyprlock — background = KDE wallpaper (written to wallpaper.conf by wallpaper.sh)
source = ~/.config/hypr/wallpaper.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Fingerprint (fprintd, same reader as sudo/KDE) — touch the sensor at any time
auth {
    fingerprint {
        enabled = true
        ready_message = Touch the fingerprint sensor or type your password
        present_message = Scanning…
        retry_delay = 250
    }
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.15
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 96
    font_family = Noto Sans Light
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(255, 255, 255, 0.75)
    font_size = 18
    font_family = Noto Sans
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 1
}

# User
label {
    monitor =
    text =   $USER
    color = rgba(255, 255, 255, 0.9)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    rounding = 24
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(89b4faee)
    inner_color = rgba(30, 30, 46, 0.65)
    font_color = rgb(255, 255, 255)
    font_family = Noto Sans
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    check_color = rgba(74c7ecee)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgb(249, 226, 175)
    position = 0, -70
    halign = center
    valign = center
    shadow_passes = 1
}

# Fingerprint / status hint under the field
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(255, 255, 255, 0.55)
    font_size = 11
    font_family = Noto Sans
    position = 0, -120
    halign = center
    valign = center
}
