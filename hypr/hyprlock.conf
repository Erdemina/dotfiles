# hyprlock — arka plan KDE'deki duvar kağıdı (wallpaper.sh tarafından wallpaper.conf'a yazılır)
source = ~/.config/hypr/wallpaper.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    blur_size = 6
    brightness = 0.7
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 72
    font_family = Noto Sans
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(255, 255, 255, 0.8)
    font_size = 20
    font_family = Noto Sans
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(ff492aee)
    inner_color = rgba(20, 20, 20, 0.8)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <i>Parola</i>
    check_color = rgba(ffd72aee)
    fail_color = rgb(255, 60, 60)
    fail_text = <i>Hatalı ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}
